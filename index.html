<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anlık İndirim Paneli</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --muted: #94a3b8;
      --text: #f8fafc;
      --border: #334155;
      --ok: #22c55e;
      --warn: #eab308;
      --err: #ef4444;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .title-group h1 { margin: 0; font-size: 1.35rem; }
    .title-group p { margin: 4px 0 0; color: var(--muted); font-size: 0.88rem; }
    .badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .badge.ok { background: rgba(34, 197, 94, 0.15); color: var(--ok); border-color: rgba(34, 197, 94, 0.35); }
    .badge.uyari { background: rgba(234, 179, 8, 0.15); color: var(--warn); border-color: rgba(234, 179, 8, 0.35); }
    .badge.hata { background: rgba(239, 68, 68, 0.15); color: var(--err); border-color: rgba(239, 68, 68, 0.35); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
    .col { display: flex; flex-direction: column; gap: 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list { display: flex; flex-direction: column; gap: 10px; max-height: 340px; overflow-y: auto; }
    .item {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.16);
      font-size: 0.9rem;
    }
    .item.err { border-color: rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.08); }
    .item.uyari { border-color: rgba(234, 179, 8, 0.45); background: rgba(234, 179, 8, 0.08); }
    .time { display: block; font-size: 0.76rem; color: var(--muted); margin-bottom: 4px; }

    .featured {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    @media (max-width: 600px) {
      .featured { flex-direction: column; }
    }
    .featured img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      background: #fff;
      border-radius: 10px;
      padding: 8px;
      flex-shrink: 0;
    }
    .prod-title { font-size: 1.05rem; font-weight: 600; margin: 0 0 8px; line-height: 1.35; }
    .price-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .price-now { font-size: 1.15rem; font-weight: 700; color: var(--ok); }
    .price-old { text-decoration: line-through; color: var(--muted); font-size: 0.9rem; }
    .disc-tag {
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .meta { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
    a.btn {
      display: inline-block;
      text-decoration: none;
      background: var(--accent);
      color: #082f49;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
    }
    .recent-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.86rem;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.55);
    }
    .recent-item span:last-child { color: var(--ok); font-weight: 600; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>@anlikiindirim — Bot Kontrol & Durum Paneli</h1>
      <p id="son-tarama">Son tarama: Yükleniyor...</p>
    </div>
    <span id="durum-rozet" class="badge">Kontrol ediliyor</span>
  </header>

  <main class="grid">
    <!-- SOL SÜTUN: Hatalar ve Bot Bildirimleri -->
    <section class="col">
      <div class="card">
        <h2><span>Hatalar</span><span id="hata-sayisi" class="badge hata">0</span></h2>
        <div id="hata-listesi" class="list"></div>
      </div>

      <div class="card">
        <h2><span>Bot Bildirimleri & Uyarılar</span><span id="bildirim-sayisi" class="badge">0</span></h2>
        <div id="bildirim-listesi" class="list"></div>
      </div>
    </section>

    <!-- SAĞ SÜTUN: Son Paylaşılan Ürün ve Detayı -->
    <section class="col">
      <div class="card">
        <h2><span>Son Paylaşılan Ürün</span><span id="toplam-paylasim" class="badge ok">0 toplam</span></h2>
        <div id="son-urun-detay">Henüz paylaşılmış ürün verisi yok.</div>
      </div>

      <div class="card">
        <h2><span>Son Paylaşımlar</span></h2>
        <div id="son-paylasimlar" class="list"></div>
      </div>
    </section>
  </main>

  <script>
    async function yukle() {
      try {
        const res = await fetch("durum.json?t=" + Date.now());
        if (!res.ok) throw new Error("durum.json henüz oluşturulmamış.");
        const d = await res.json();

        document.getElementById("son-tarama").textContent =
          "Son tarama: " + (d.son_tarama || "-") + " · Toplam paylaşım: " + (d.toplam_paylasim ?? 0);

        const rozet = document.getElementById("durum-rozet");
        const durum = (d.durum || "ok").toLowerCase();
        rozet.className = "badge " + (durum === "hata" ? "hata" : durum === "uyari" ? "uyari" : "ok");
        rozet.textContent = durum === "hata" ? "Hata Var" : durum === "uyari" ? "Uyarı / Boş" : "Sorunsuz";

        const hatalar = d.hatalar || [];
        document.getElementById("hata-sayisi").textContent = hatalar.length;
        document.getElementById("hata-listesi").innerHTML = hatalar.length
          ? hatalar.map(h => `<div class="item err"><span class="time">${h.zaman || ""}</span>${h.mesaj}</div>`).join("")
          : `<div class="item">Kayıtlı hata bulunmuyor.</div>`;

        const bildirimler = d.bildirimler || [];
        document.getElementById("bildirim-sayisi").textContent = bildirimler.length;
        document.getElementById("bildirim-listesi").innerHTML = bildirimler.length
          ? bildirimler.map(b => `<div class="item ${b.tip === "uyari" ? "uyari" : ""}"><span class="time">${b.zaman || ""}</span>${b.mesaj}</div>`).join("")
          : `<div class="item">Henüz yeni bildirim yok.</div>`;

        document.getElementById("toplam-paylasim").textContent = (d.toplam_paylasim ?? 0) + " paylaşım";

        const u = d.son_urun;
        const detayEl = document.getElementById("son-urun-detay");
        if (u) {
          detayEl.innerHTML = `
            <div class="featured">
              ${u.img ? `<img src="${u.img}" alt="${u.title || "Ürün"}" />` : ""}
              <div>
                <p class="prod-title">${u.title || ""}</p>
                <div class="price-row">
                  <span class="price-now">${u.satis || ""}</span>
                  ${u.eski ? `<span class="price-old">${u.eski}</span>` : ""}
                  ${u.ind ? `<span class="disc-tag">${u.ind} indirim</span>` : ""}
                </div>
                <div class="meta">ASIN: <strong>${u.asin || "-"}</strong> · Zaman: ${u.zaman || "-"}</div>
                ${u.link ? `<a class="btn" href="${u.link}" target="_blank" rel="noopener">Amazon Linkine Git</a>` : ""}
              </div>
            </div>
          `;
        } else {
          detayEl.textContent = "Henüz paylaşılmış ürün verisi yok.";
        }

        const liste = d.son_paylasimlar || [];
        document.getElementById("son-paylasimlar").innerHTML = liste.length
          ? liste.map(p => `<div class="recent-item"><span>${p.title}</span><span>${p.satis} (${p.ind || ""})</span></div>`).join("")
          : `<div class="item">Liste boş.</div>`;
      } catch (err) {
        document.getElementById("hata-listesi").innerHTML =
          `<div class="item err">${err.message}</div>`;
      }
    }
    yukle();
    setInterval(yukle, 60000);
  </script>
</body>
</html>
